
[package]
name = "glass-test-shaders"
description = "Shader entry points used by an independent library's GPU tests"
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"
publish = false

[lib]
crate-type = ["dylib", "lib"]

[dependencies]

[dependencies.tile-render-shaders]
git = "ssh://git@github.com/sirati/tilerenderer.git"
rev = "6941948fc77ad310c9021df6f01374be9d3a23fc"

[dependencies.glass-shaders]
path = "../glass-shaders"

[lints]

[lints.rust]

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ["cfg(target_arch, values(\"spirv\"))"]
