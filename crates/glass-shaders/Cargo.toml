
[package]
name = "glass-shaders"
description = "rust-gpu shaders of the glass lens: a rounded glass slab with a halo over a view or a screen copy (linked into viewer-shaders)"
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[lib]
crate-type = ["lib"]

[dependencies]
spirv-std = "0.11"

[dependencies.glass-shared]
path = "../glass-shared"

[dependencies.tile-render-shared]
git = "ssh://git@github.com/sirati/tilerenderer.git"
rev = "6941948fc77ad310c9021df6f01374be9d3a23fc"

[lints]

[lints.rust]

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ["cfg(target_arch, values(\"spirv\"))"]
