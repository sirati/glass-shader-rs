[workspace]
resolver = "3"
members = [
    "crates/tile-render-shared",
    "crates/tile-render",
    "crates/civ3-assets",
]
# The shader crate is compiled by rust-gpu (pinned nightly) from
# tile-render's build script, never by the workspace toolchain.
exclude = ["crates/tile-render-shaders"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
tile-render-shared = { path = "crates/tile-render-shared" }
tile-render = { path = "crates/tile-render" }
bytemuck = { version = "1.24", features = ["derive"] }
glam = "0.30"
wgpu = { version = "30", features = ["spirv"] }
winit = "0.30"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev.package."*"]
opt-level = 2
