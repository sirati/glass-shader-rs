
[workspace]
resolver = "3"
members = ["crates/glass", "crates/glass-shared", "crates/glass-test-spirv"]
exclude = ["crates/glass-shaders", "crates/glass-test-shaders", "vendor"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
pollster = "0.4"

[workspace.dependencies.tile-render]
git = "ssh://git@github.com/sirati/tilerenderer.git"
rev = "6941948fc77ad310c9021df6f01374be9d3a23fc"

[workspace.dependencies.bytemuck]
version = "1.24"
features = ["derive", "min_const_generics"]

[workspace.dependencies.wgpu]
version = "30"
features = ["spirv", "vulkan-portability"]

[workspace.dependencies.image]
version = "0.25"
default-features = false
features = ["png"]

[profile]

[profile.dev]

[profile.dev.package]

[profile.dev.package."*"]
opt-level = 2

[patch]

[patch.crates-io]

[patch.crates-io.wgpu-hal]
git = "ssh://git@github.com/sirati/tilerenderer.git"
rev = "6941948fc77ad310c9021df6f01374be9d3a23fc"
